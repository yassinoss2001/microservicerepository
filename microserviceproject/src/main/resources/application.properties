spring.application.name=microserviceproject


# Nom de l'application

# Désactiver le client Spring Cloud Config (si non utilisé)
spring.cloud.config.enabled=false

# Port du serveur
server.port=8081

# Configuration de la console H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2

# Configuration de la base de données H2
spring.datasource.username=M
spring.datasource.password=
spring.datasource.url=jdbc:h2:file:./Database/Data/menucrud
spring.datasource.driver-class-name=org.h2.Driver

# Configuration Hibernate
spring.jpa.hibernate.ddl-auto = create

